services:
  redis:
    image: redis:7-alpine
    container_name: ds-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warehouse-net

  policy-engine:
    build:
      context: ./services/policy-engine
    container_name: policy-engine
    environment:
      POLICY_ADMIT_SIZE_THRESHOLD_BYTES: "67108864"
      POLICY_ADMIT_FREQUENCY_THRESHOLD: "3"
      POLICY_LRU_RECENCY_THRESHOLD_SECONDS: "60"
      POLICY_ML_SCORE_THRESHOLD: "0.55"
      POLICY_ML_MODEL_PATH: /app/models/logreg_reuse_model.joblib
      POLICY_ML_REUSE_HORIZON_REQUESTS: "5"
      POLICY_ML_FEATURE_SET: ${POLICY_ML_FEATURE_SET:-set-b}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./models:/app/models
    networks:
      - warehouse-net

  telemetry-collector:
    build:
      context: ./services/telemetry-collector
    container_name: telemetry-collector
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warehouse-net

  compute-worker-1:
    build:
      context: ./services/compute-worker
    container_name: compute-worker-1
    depends_on:
      redis:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      telemetry-collector:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      POLICY_ENGINE_URL: http://policy-engine:8001
      TELEMETRY_COLLECTOR_URL: http://telemetry-collector:8002
      OBJECT_STORE_ROOT: /data/object-store
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
      OBJECT_STORE_PREFIX: ${OBJECT_STORE_PREFIX:-}
      CACHE_ROOT: /data/cache
      CACHE_CAPACITY_BYTES: ${CACHE_CAPACITY_BYTES:-134217728}
      CACHE_EVICTION_POLICY: ${CACHE_EVICTION_POLICY:-lru}
      POLICY_NAME: ${POLICY_NAME:-baseline-lru}
      WORKER_ID: worker-1
      OBJECT_STORE_BASE_LATENCY_MS: "25.0"
      OBJECT_STORE_MB_PER_SEC: "120.0"
      TRANSFER_COST_PER_MB: "0.00002"
      TRAINING_LOG_DIR: /data/training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./data/object-store:/data/object-store
      - ./data/cache/compute-worker-1:/data/cache
      - ./training-data:/data/training
    networks:
      - warehouse-net

  compute-worker-2:
    build:
      context: ./services/compute-worker
    container_name: compute-worker-2
    depends_on:
      redis:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      telemetry-collector:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      POLICY_ENGINE_URL: http://policy-engine:8001
      TELEMETRY_COLLECTOR_URL: http://telemetry-collector:8002
      OBJECT_STORE_ROOT: /data/object-store
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
      OBJECT_STORE_PREFIX: ${OBJECT_STORE_PREFIX:-}
      CACHE_ROOT: /data/cache
      CACHE_CAPACITY_BYTES: ${CACHE_CAPACITY_BYTES:-134217728}
      CACHE_EVICTION_POLICY: ${CACHE_EVICTION_POLICY:-lru}
      POLICY_NAME: ${POLICY_NAME:-baseline-lru}
      WORKER_ID: worker-2
      OBJECT_STORE_BASE_LATENCY_MS: "25.0"
      OBJECT_STORE_MB_PER_SEC: "120.0"
      TRANSFER_COST_PER_MB: "0.00002"
      TRAINING_LOG_DIR: /data/training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./data/object-store:/data/object-store
      - ./data/cache/compute-worker-2:/data/cache
      - ./training-data:/data/training
    networks:
      - warehouse-net

  compute-worker-3:
    build:
      context: ./services/compute-worker
    container_name: compute-worker-3
    depends_on:
      redis:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      telemetry-collector:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      POLICY_ENGINE_URL: http://policy-engine:8001
      TELEMETRY_COLLECTOR_URL: http://telemetry-collector:8002
      OBJECT_STORE_ROOT: /data/object-store
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
      OBJECT_STORE_PREFIX: ${OBJECT_STORE_PREFIX:-}
      CACHE_ROOT: /data/cache
      CACHE_CAPACITY_BYTES: ${CACHE_CAPACITY_BYTES:-134217728}
      CACHE_EVICTION_POLICY: ${CACHE_EVICTION_POLICY:-lru}
      POLICY_NAME: ${POLICY_NAME:-baseline-lru}
      WORKER_ID: worker-3
      OBJECT_STORE_BASE_LATENCY_MS: "25.0"
      OBJECT_STORE_MB_PER_SEC: "120.0"
      TRANSFER_COST_PER_MB: "0.00002"
      TRAINING_LOG_DIR: /data/training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./data/object-store:/data/object-store
      - ./data/cache/compute-worker-3:/data/cache
      - ./training-data:/data/training
    networks:
      - warehouse-net

  model-trainer:
    build:
      context: ./training
    container_name: model-trainer
    volumes:
      - ./training:/app/training
      - ./training-data:/app/training-data
      - ./models:/app/models
    networks:
      - warehouse-net

  request-router:
    build:
      context: ./services/request-router
    container_name: request-router
    depends_on:
      compute-worker-1:
        condition: service_healthy
      compute-worker-2:
        condition: service_healthy
      compute-worker-3:
        condition: service_healthy
    environment:
      ROUTER_WORKERS: worker-1=http://compute-worker-1:8000,worker-2=http://compute-worker-2:8000,worker-3=http://compute-worker-3:8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warehouse-net

  workload-generator:
    build:
      context: ./services/workload-generator
    container_name: workload-generator
    depends_on:
      request-router:
        condition: service_healthy
    environment:
      ROUTER_URL: http://request-router:8000
      TELEMETRY_URL: http://telemetry-collector:8002
      TRACE_FILE: /app/traces/sample-trace.jsonl
      WORKLOAD_CONFIG_FILE: /app/configs/default-workload.json
      WORKLOAD_CONCURRENCY: "8"
      WORKLOAD_SEED: "7"
    volumes:
      - ./traces:/app/traces:ro
      - ./configs:/app/configs:ro
    networks:
      - warehouse-net

networks:
  warehouse-net:
    driver: bridge
